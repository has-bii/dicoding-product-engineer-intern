opencollection: 1.0.0

info:
  name: Dicoding Vacancy Platform API
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""
request:
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{AUTH_TOKEN}}"
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
