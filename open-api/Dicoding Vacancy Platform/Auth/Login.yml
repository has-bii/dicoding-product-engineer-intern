info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@dicoding.com",
        "password": "dicoding123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const token = res.getBody().token
          bru.setEnvVar("AUTH_TOKEN", token)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
