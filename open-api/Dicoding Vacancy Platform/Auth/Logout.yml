info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{API_URL}}/auth/logout"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
          bru.setEnvVar("AUTH_TOKEN", "")
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
